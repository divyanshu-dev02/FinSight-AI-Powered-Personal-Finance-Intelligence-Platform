# FinSight — Render.com deployment manifest
# Docs: https://render.com/docs/yaml-spec

services:
  # ── 1. Spring Boot Backend ─────────────────────────────────────────────────
  - type: web
    name: finsight-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: finsight-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finsight-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: finsight-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: finsight-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finsight-postgres
          property: password
      - key: SPRING_PROFILES_ACTIVE
        value: hosted-demo
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: DEMO_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
      - key: JWT_REFRESH_TTL_SECONDS
        value: "2592000"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://finsight-frontend-ue2k.onrender.com"

  # ── 2. React Frontend ──────────────────────────────────────────────────────
  - type: web
    name: finsight-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free

# ── 3. PostgreSQL 16 Database ──────────────────────────────────────────────
databases:
  - name: finsight-postgres
    plan: free
    databaseName: finsight
    user: finsight

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Cache static assets aggressively (hashed filenames via Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend service so the frontend can use same-origin URLs.
    location /api/ {
        proxy_pass https://finsight-backend-xctn.onrender.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name finsight-backend-xctn.onrender.com;
        proxy_set_header Host finsight-backend-xctn.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

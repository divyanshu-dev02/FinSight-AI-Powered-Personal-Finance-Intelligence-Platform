spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finsight}
    username: ${DB_USERNAME:finsight}
    password: ${DB_PASSWORD:finsight_local_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

jwt:
  secret: test-secret-must-be-at-least-256-bits-long-for-hmac-sha256-signing-algorithm
  access-ttl-seconds: 300
  refresh-ttl-seconds: 3600
